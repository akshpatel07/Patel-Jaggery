services:
  sweetharvest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sweetharvest-app
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - DB_PATH=/app/data/sweetharvest.db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment}
    volumes:
      # Persist SQLite database on host machine
      - ./data:/app/data
