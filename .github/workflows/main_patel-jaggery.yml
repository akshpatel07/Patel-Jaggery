name: Build and deploy SweetHarvest to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-patel-jaggery-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm install --omit=dev

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy/backend deploy/frontend
          cp -r backend/dist deploy/backend/
          cp -r backend/node_modules deploy/backend/
          cp backend/package.json backend/package-lock.json deploy/backend/
          cp -r frontend/dist deploy/frontend/
          cd deploy
          zip -qr ../app.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: sweetharvest-app
          path: app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: https://patel-jaggery-aufcanffa2cjacbb.centralindia-01.azurewebsites.net

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: sweetharvest-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E383B19DEB7D4678819F0BFFB21697E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E7DFD80331E641419A700D53F7D93328 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_82CF5BBF46E64DA5B345075E9E39B371 }}

      - name: Deploy package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Patel-jaggery
          slot-name: Production
          package: app.zip
          clean: true
